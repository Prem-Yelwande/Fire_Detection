[project]
name = "fire-detection"
version = "0.1.0"
description = "Real-time fire and smoke detection using YOLO11 and OpenCV"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "ultralytics",
    "opencv-python",
    "fastapi",
    "uvicorn",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
